name: Publish Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # The whole security gate must pass on the tagged commit before publishing.
  security-gate:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-gate.yml

  publish:
    name: Build and publish release
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      # build.js refuses to package unless the tag, plugin header, version
      # constant, package files and CHANGELOG all name the same version.
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node devtools/build.js --package --tag "$RELEASE_TAG"
          node tests/build-assets.cjs
          cd build
          zip -r -X "alps-gutenberg-blocks-${RELEASE_TAG}.zip" alps-gutenberg-blocks
      # Installed copies update from this asset (updater.php). An existing
      # release for the tag makes this fail rather than being replaced.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" "build/alps-gutenberg-blocks-${RELEASE_TAG}.zip"
          --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes --verify-tag
