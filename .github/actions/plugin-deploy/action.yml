name: 'WP Plugin::Deploy'
description: 'Build and deploy WordPress plugin with maintained hosted runtimes'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.4'
        coverage: none
        tools: composer:v2
    - shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    - shell: bash
      run: npm run wp:plugin:build
    - shell: bash
      run: npm run wp:plugin:release
